<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Freelancer PayMe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .tooltip {
            position: relative;
            display: inline-block;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 140px;
            background-color: #555;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 150%;
            left: 50%;
            margin-left: -70px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #555 transparent transparent transparent;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .modal {
            display: none; 
            position: fixed; 
            z-index: 100; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0,0,0,0.6); 
        }
        .modal-content {
            background-color: #1f2937; /* slate-800 */
            color: #e5e7eb; /* gray-200 */
            margin: 10% auto; 
            padding: 25px;
            border: 1px solid #374151; /* slate-700 */
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .modal-close-button {
            color: #9ca3af; /* gray-400 */
            float: right;
            font-size: 32px;
            font-weight: bold;
            line-height: 1;
        }
        .modal-close-button:hover,
        .modal-close-button:focus {
            color: #e5e7eb; /* gray-200 */
            text-decoration: none;
            cursor: pointer;
        }
        .input-error-text {
            color: #f87171; /* red-400 */
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-purple-500 selection:text-white">

    <div class="bg-slate-800 shadow-2xl rounded-xl p-6 md:p-10 w-full max-w-lg transform transition-all duration-500 hover:scale-[1.01]">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-red-500">Solana PayMe</h1>
            <p class="text-slate-400 mt-2">Generate Solana payment requests instantly.</p>
        </header>

        <form id="paymentRequestForm" class="space-y-6">
            <div>
                <label for="walletAddress" class="block text-sm font-medium text-slate-300 mb-1">Your Solana Wallet Address</label>
                <div class="flex space-x-2">
                    <input type="text" id="walletAddress" name="walletAddress" required
                           class="flex-grow p-3 bg-slate-700 border border-slate-600 rounded-lg text-gray-100 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 placeholder-slate-500"
                           placeholder="Enter or connect wallet...">
                    <button type="button" id="connectWalletButton"
                            class="p-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transform transition-all duration-150 ease-in-out text-sm">
                        Connect
                    </button>
                </div>
                <p id="walletAddressError" class="input-error-text" style="display: none;"></p>
            </div>

            <div>
                <label for="amount" class="block text-sm font-medium text-slate-300 mb-1">Amount</label>
                <input type="number" id="amount" name="amount" step="0.000001" min="0.000001" required
                       class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-gray-100 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 placeholder-slate-500"
                       placeholder="e.g., 10.50">
                <p id="amountError" class="input-error-text" style="display: none;"></p>
            </div>

            <div>
                <label for="stablecoin" class="block text-sm font-medium text-slate-300 mb-1">Stablecoin</label>
                <select id="stablecoin" name="stablecoin"
                        class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-gray-100 focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                    <option value="USDC">USDC</option>
                    <option value="USDT">USDT</option>
                </select>
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-slate-300 mb-1">Invoice Description/Label</label>
                <input type="text" id="description" name="description" required
                       class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-gray-100 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 placeholder-slate-500"
                       placeholder="e.g., Design Services Q2">
            </div>
            
            <div>
                <label for="message" class="block text-sm font-medium text-slate-300 mb-1">Message to Payer (Optional)</label>
                <input type="text" id="message" name="message"
                       class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-gray-100 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 placeholder-slate-500"
                       placeholder="e.g., Thanks for your business!">
            </div>

            <button type="submit" id="generateRequestButton"
                    class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transform transition-all duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-800 focus:ring-pink-500">
                Generate Payment Request
            </button>
        </form>

        <div id="paymentDetails" class="mt-10 p-6 bg-slate-700 rounded-xl shadow-inner" style="display: none;">
            <h2 class="text-2xl font-semibold text-center text-transparent bg-clip-text bg-gradient-to-r from-green-300 via-teal-400 to-sky-500 mb-6">Payment Request</h2>
            
            <div class="text-center mb-6">
                <canvas id="qrCodeCanvas" class="mx-auto border-4 border-slate-500 rounded-lg shadow-lg bg-white"></canvas>
                 <p id="qrCodeError" class="input-error-text mt-2" style="display: none;"></p>
            </div>

            <div class="space-y-3 text-sm mb-6">
                <p><strong class="text-slate-400">Recipient:</strong> <span id="displayWallet" class="break-all text-slate-200"></span></p>
                <p><strong class="text-slate-400">Amount:</strong> <span id="displayAmount" class="text-slate-200"></span></p>
                <p><strong class="text-slate-400">Token:</strong> <span id="displayToken" class="text-slate-200"></span></p>
                <p><strong class="text-slate-400">Label:</strong> <span id="displayDescription" class="text-slate-200"></span></p>
                <p id="displayMessageContainer" style="display:none;"><strong class="text-slate-400">Message:</strong> <span id="displayMessage" class="text-slate-200"></span></p>
            </div>
            
            <button id="payWithWalletButton" style="display:none;"
                    class="w-full mb-4 bg-gradient-to-r from-green-500 to-teal-500 hover:from-green-600 hover:to-teal-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transform transition-all duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-700 focus:ring-teal-400">
                Pay with Connected Wallet
            </button>

            <div class="mt-4 space-y-3">
                <div class="relative">
                     <input type="text" id="solanaPayUrl" readonly class="w-full p-3 bg-slate-600 border border-slate-500 rounded-lg text-gray-200 text-xs pr-20 truncate">
                     <button onclick="copyToClipboard('solanaPayUrl', 'tooltipSolanaPayUrl')"
                             class="absolute right-1 top-1/2 transform -translate-y-1/2 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold py-2 px-3 rounded-md tooltip">
                         Copy URL
                         <span class="tooltiptext" id="tooltipSolanaPayUrl">Copy Solana Pay URL</span>
                     </button>
                </div>
                <div class="relative">
                     <input type="text" id="walletAddressCopy" readonly class="w-full p-3 bg-slate-600 border border-slate-500 rounded-lg text-gray-200 text-xs pr-20 truncate">
                     <button onclick="copyToClipboard('walletAddressCopy', 'tooltipWalletAddressCopy')"
                             class="absolute right-1 top-1/2 transform -translate-y-1/2 bg-teal-500 hover:bg-teal-600 text-white text-xs font-semibold py-2 px-3 rounded-md tooltip">
                         Copy Addr
                         <span class="tooltiptext" id="tooltipWalletAddressCopy">Copy Wallet Address</span>
                     </button>
                </div>
                 <div class="relative">
                     <input type="text" id="shareableLink" readonly class="w-full p-3 bg-slate-600 border border-slate-500 rounded-lg text-gray-200 text-xs pr-20 truncate">
                     <button onclick="copyToClipboard('shareableLink', 'tooltipShareableLink')"
                             class="absolute right-1 top-1/2 transform -translate-y-1/2 bg-pink-500 hover:bg-pink-600 text-white text-xs font-semibold py-2 px-3 rounded-md tooltip">
                         Share Link
                         <span class="tooltiptext" id="tooltipShareableLink">Copy Shareable Link</span>
                     </button>
                </div>
            </div>
             <button onclick="resetForm()" class="mt-6 w-full bg-slate-600 hover:bg-slate-500 text-white font-semibold py-2 px-4 rounded-lg">
                Create New Request
            </button>
        </div>
    </div>

    <div id="notificationModal" class="modal">
      <div class="modal-content">
        <span class="modal-close-button" onclick="closeModal()">&times;</span>
        <p id="notificationMessage" class="text-lg"></p>
      </div>
    </div>

    <footer class="text-center text-slate-500 mt-12 pb-6 text-sm">
        <p>Built for the Solana Ecosystem. Use at your own risk.</p>
        <p>This tool helps generate payment requests. Ensure your wallet is connected to Solana Mainnet-beta.</p>
    </footer>

    <script>
        // Solana SPL Token Mint Addresses
        const STABLECOIN_MINTS = {
            "USDC": "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", // USDC on Solana Mainnet-beta
            "USDT": "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB"  // USDT on Solana Mainnet-beta
        };

        // DOM Elements
        const paymentRequestForm = document.getElementById('paymentRequestForm');
        const paymentDetailsDiv = document.getElementById('paymentDetails');
        const qrCodeCanvas = document.getElementById('qrCodeCanvas');
        const qrCodeErrorEl = document.getElementById('qrCodeError');
        
        const walletAddressInput = document.getElementById('walletAddress');
        const walletAddressError = document.getElementById('walletAddressError');
        const amountInput = document.getElementById('amount');
        const amountError = document.getElementById('amountError');
        
        const connectWalletButton = document.getElementById('connectWalletButton');
        const payWithWalletButton = document.getElementById('payWithWalletButton');
        
        const notificationModal = document.getElementById('notificationModal');
        const notificationMessage = document.getElementById('notificationMessage');
        const modalCloseButton = document.querySelector('.modal-close-button');

        let isPayerView = false; // Flag to indicate if loaded from shareable link

        // --- Modal Functions ---
        function showModal(message) {
            notificationMessage.innerHTML = message; // Use innerHTML to allow basic formatting
            notificationModal.style.display = "block";
        }
        function closeModal() {
            notificationModal.style.display = "none";
        }
        window.onclick = function(event) {
            if (event.target == notificationModal) {
                closeModal();
            }
        }
        if(modalCloseButton) modalCloseButton.onclick = closeModal;

        // --- Wallet Address Validation (Realtime and Final) ---
        function validateWalletAddressRealtime() {
            const value = walletAddressInput.value;
            if (!value) { // Empty is not an error state until submission
                walletAddressError.style.display = 'none';
                walletAddressInput.classList.remove('border-red-500', 'focus:border-red-500');
                walletAddressInput.classList.add('border-slate-600', 'focus:border-purple-500');
                return true; 
            }
            // Allows only base58 characters and checks max length
            if (!/^[1-9A-HJ-NP-Za-km-z]{0,44}$/.test(value)) {
                walletAddressError.textContent = 'Invalid characters. Only Base58 allowed.';
                walletAddressError.style.display = 'block';
                walletAddressInput.classList.add('border-red-500', 'focus:border-red-500');
                walletAddressInput.classList.remove('border-slate-600', 'focus:border-purple-500');
                return false;
            } else if (value.length > 0 && (value.length < 32 || value.length > 44)) {
                 walletAddressError.textContent = 'Address must be between 32 and 44 characters.';
                 walletAddressError.style.display = 'block';
                 walletAddressInput.classList.add('border-red-500', 'focus:border-red-500');
                 walletAddressInput.classList.remove('border-slate-600', 'focus:border-purple-500');
                 return false; // Technically invalid length, but might be mid-typing
            } else {
                walletAddressError.style.display = 'none';
                walletAddressInput.classList.remove('border-red-500', 'focus:border-red-500');
                walletAddressInput.classList.add('border-slate-600', 'focus:border-purple-500');
                return true;
            }
        }

        function isWalletAddressFormatValid(address) {
            // Strict validation for submission: 32-44 base58 characters.
            return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(address);
        }
        
        if(walletAddressInput) walletAddressInput.addEventListener('input', validateWalletAddressRealtime);

        // --- Amount Validation ---
        function validateAmount() {
            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                amountError.textContent = 'Amount must be a positive number.';
                amountError.style.display = 'block';
                amountInput.classList.add('border-red-500', 'focus:border-red-500');
                return false;
            }
            amountError.style.display = 'none';
            amountInput.classList.remove('border-red-500', 'focus:border-red-500');
            return true;
        }
        if(amountInput) amountInput.addEventListener('input', validateAmount);


        // --- Connect Wallet (Freelancer) ---
        async function connectFreelancerWallet() {
            // Check for Phantom (window.phantom.solana or window.solana if Phantom is the only one)
            // or Solflare (window.solflare.solana)
            const provider = window.phantom?.solana || window.solana || window.solflare?.solana;

            if (provider && provider.isPhantom !== undefined || provider && provider.isSolflare !== undefined) {
                try {
                    // Try to connect. Some wallets might require 'onlyIfTrusted' for initial auto-connect.
                    // For explicit button click, a direct request is fine.
                    const resp = await provider.connect();
                    const publicKey = resp.publicKey.toString();
                    walletAddressInput.value = publicKey;
                    validateWalletAddressRealtime(); // Update validation display
                    showModal("Wallet connected successfully!<br><small class='text-slate-400'>Address: " + publicKey.substring(0,6) + "..." + publicKey.substring(publicKey.length - 6) + "</small>");
                } catch (err) {
                    console.error("Wallet connection failed:", err);
                    showModal("Wallet connection failed. Make sure your wallet is unlocked and try again. <br><small class='text-slate-400'>" + (err.message || '') + "</small>");
                }
            } else {
                showModal("Solana wallet extension (like Phantom or Solflare) not detected. Please install one to use this feature, or enter your address manually.");
            }
        }
        if(connectWalletButton) connectWalletButton.addEventListener('click', connectFreelancerWallet);

        // --- Load from URL Parameters (Payer View) ---
        function loadFromURLParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const wallet = urlParams.get('wallet');
            const amount = urlParams.get('amount');
            const token = urlParams.get('token'); // This will be the mint address
            const label = urlParams.get('label');
            const msg = urlParams.get('message');

            if (wallet && amount && token && label) {
                isPayerView = true;
                document.getElementById('walletAddress').value = wallet;
                document.getElementById('amount').value = amount;
                
                const stablecoinSelect = document.getElementById('stablecoin');
                for (const option of stablecoinSelect.options) {
                    if (STABLECOIN_MINTS[option.value] === token) {
                        option.selected = true;
                        break;
                    }
                }
                document.getElementById('description').value = label;
                if (msg) {
                    document.getElementById('message').value = msg;
                }
                generatePaymentRequest(); // Automatically generate and display
            }
        }
        
        window.onload = () => {
            if (!window.QRious) {
                 showModal("QR Code generation library (QRious) failed to load. QR codes will not be available. Please check your internet connection or ad-blockers.");
                 if(qrCodeErrorEl) {
                    qrCodeErrorEl.textContent = "QR library failed to load.";
                    qrCodeErrorEl.style.display = "block";
                 }
            }
            loadFromURLParams();
        };

        // --- Form Submission and Payment Request Generation ---
        if(paymentRequestForm) {
            paymentRequestForm.addEventListener('submit', function(event) {
                event.preventDefault();
                generatePaymentRequest();
            });
        }

        function generatePaymentRequest() {
            const walletAddress = walletAddressInput.value.trim();
            const amount = amountInput.value;
            const stablecoinSymbol = document.getElementById('stablecoin').value;
            const description = document.getElementById('description').value.trim();
            const message = document.getElementById('message').value.trim();

            // Validate inputs
            let isValid = true;
            if (!isWalletAddressFormatValid(walletAddress)) {
                walletAddressError.textContent = 'Invalid or incomplete Solana wallet address.';
                walletAddressError.style.display = 'block';
                walletAddressInput.classList.add('border-red-500', 'focus:border-red-500');
                walletAddressInput.focus();
                isValid = false;
            } else {
                 walletAddressError.style.display = 'none';
                 walletAddressInput.classList.remove('border-red-500', 'focus:border-red-500');
            }

            if (!validateAmount()) {
                if(isValid) amountInput.focus(); // Only focus if wallet was valid
                isValid = false;
            }
            
            if (!description) {
                showModal("Invoice description cannot be empty.");
                if(isValid) document.getElementById('description').focus();
                isValid = false;
            }


            if (!isValid) {
                showModal("Please correct the errors in the form.");
                return;
            }

            const tokenMintAddress = STABLECOIN_MINTS[stablecoinSymbol];
            let solanaPayUrl = `solana:${walletAddress}?amount=${amount}&spl-token=${tokenMintAddress}&label=${encodeURIComponent(description)}`;
            if (message) {
                solanaPayUrl += `&message=${encodeURIComponent(message)}`;
            }

            // Display details
            document.getElementById('displayWallet').textContent = walletAddress;
            document.getElementById('displayAmount').textContent = `${amount} ${stablecoinSymbol}`;
            document.getElementById('displayToken').textContent = `${stablecoinSymbol} (${tokenMintAddress})`;
            document.getElementById('displayDescription').textContent = description;
            
            const displayMessageContainer = document.getElementById('displayMessageContainer');
            const displayMessageEl = document.getElementById('displayMessage');
            if (message) {
                displayMessageEl.textContent = message;
                displayMessageContainer.style.display = 'block';
            } else {
                displayMessageContainer.style.display = 'none';
            }

            document.getElementById('solanaPayUrl').value = solanaPayUrl;
            document.getElementById('walletAddressCopy').value = walletAddress;

            // Generate QR Code
            qrCodeErrorEl.style.display = "none"; // Clear previous QR error
            if (window.QRious) {
                try {
                    new QRious({
                        element: qrCodeCanvas,
                        value: solanaPayUrl,
                        size: 200,
                        padding: 10,
                        level: 'H',
                        background: '#FFFFFF',
                        foreground: '#1f2937'
                    });
                    qrCodeCanvas.style.display = 'block';
                } catch (e) {
                    console.error("QRious generation failed:", e);
                    qrCodeCanvas.style.display = 'none';
                    qrCodeErrorEl.textContent = "Failed to generate QR code.";
                    qrCodeErrorEl.style.display = "block";
                    showModal("Could not generate QR code. The payment URL is still available for manual use.");
                }
            } else {
                qrCodeCanvas.style.display = 'none';
                qrCodeErrorEl.textContent = "QR library not loaded. QR code unavailable.";
                qrCodeErrorEl.style.display = "block";
            }
            
            const shareableLinkParams = new URLSearchParams({
                wallet: walletAddress,
                amount: amount,
                token: tokenMintAddress,
                label: description
            });
            if (message) {
                shareableLinkParams.set('message', message);
            }
            const shareLink = `${window.location.origin}${window.location.pathname}?${shareableLinkParams.toString()}`;
            document.getElementById('shareableLink').value = shareLink;

            paymentDetailsDiv.style.display = 'block';
            paymentRequestForm.style.display = 'none';
            
            if (isPayerView) {
                payWithWalletButton.style.display = 'block';
                payWithWalletButton.onclick = () => {
                    // Attempt to trigger the Solana Pay URL directly
                    // This relies on the user's OS/browser having a handler for 'solana:' URIs
                    showModal("Attempting to open with your Solana wallet... <br><br>If nothing happens, please scan the QR code or copy the payment URL manually.");
                    window.location.href = solanaPayUrl;
                };
            } else {
                payWithWalletButton.style.display = 'none';
            }

            paymentDetailsDiv.scrollIntoView({ behavior: 'smooth' });
        }

        // --- Copy to Clipboard ---
        function copyToClipboard(elementId, tooltipId) { // tooltipId is the ID of the span
            const inputElement = document.getElementById(elementId);
            inputElement.select();
            inputElement.setSelectionRange(0, 99999); 

            try {
                navigator.clipboard.writeText(inputElement.value).then(() => {
                    showModal(`Copied to clipboard!`);
                    const tooltipSpan = document.getElementById(tooltipId); // Get the span by its ID
                    if(tooltipSpan) {
                        const originalText = tooltipSpan.dataset.originalText || tooltipSpan.textContent;
                        if (!tooltipSpan.dataset.originalText) {
                             tooltipSpan.dataset.originalText = originalText;
                        }
                        tooltipSpan.textContent = 'Copied!';
                        setTimeout(() => {
                            tooltipSpan.textContent = originalText;
                        }, 2000);
                    }
                }).catch(err => {
                    console.error('Clipboard copy failed: ', err);
                    showModal('Failed to copy. Please copy manually.');
                });
            } catch (e) {
                try { // Fallback for older environments
                    document.execCommand('copy');
                    showModal(`Copied to clipboard (fallback)!`);
                } catch (errFallback) {
                    showModal('Failed to copy. Please copy manually.');
                    console.error('Fallback clipboard copy failed: ', errFallback);
                }
            }
        }
        
        // --- Reset Form ---
        function resetForm() {
            paymentRequestForm.reset();
            walletAddressError.style.display = 'none';
            amountError.style.display = 'none';
            walletAddressInput.classList.remove('border-red-500', 'focus:border-red-500');
            amountInput.classList.remove('border-red-500', 'focus:border-red-500');

            paymentDetailsDiv.style.display = 'none';
            paymentRequestForm.style.display = 'block';
            payWithWalletButton.style.display = 'none';
            isPayerView = false;
            
            // Clear URL parameters
            window.history.pushState({}, document.title, window.location.pathname);
            walletAddressInput.focus();
        }

    </script>
</body>
</html>
